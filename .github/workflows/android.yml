name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes unitários e build Debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantoSobra-0.1.0-alpha.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
