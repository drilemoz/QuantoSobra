name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes unitários e build Debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantoSobra-0.1.0-alpha.9-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar assinatura opcional do APK Release
        if: github.event_name != 'pull_request'
        id: release_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Assinatura Release não configurada. APK Debug disponível nos Artifacts."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quanto-sobra-release.p12"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Gerar APK Release assinado
        if: github.event_name != 'pull_request' && steps.release_signing.outputs.enabled == 'true'
        env:
          QUANTO_SOBRA_KEYSTORE_PATH: ${{ runner.temp }}/quanto-sobra-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Disponibilizar APK Release assinado
        if: github.event_name != 'pull_request' && steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QuantoSobra-0.1.0-alpha.9-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remover keystore temporária do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/quanto-sobra-release.p12"
